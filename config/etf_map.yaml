# Curated sector -> popular US-listed ETFs.
# leverage: 1x = plain ETF; 2x/3x = leveraged long; -1x/-2x/-3x = inverse.
# Leveraged/inverse ETFs reset daily and decay over time; they suit short-term trades only.
# Edit freely: Claude picks sector keys from this list, and the report shows these tickers.
